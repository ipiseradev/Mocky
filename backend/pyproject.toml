[project]
name = "mocky-backend"
version = "0.1.0"
description = "Backend tecnico de Mocky"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "SQLAlchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "ruff==0.17.3",
  "pyright==1.1.414",
  "pytest==9.2.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
